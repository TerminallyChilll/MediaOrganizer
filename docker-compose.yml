services:
  # 🧪 Interactive Wizard: Use this to run the CLI normally
  # Command: docker compose run --rm media-organizer
  media-organizer:
    build: .
    image: media-organizer:latest
    container_name: media-organizer
    # We need tty and stdin_open to make the interactive CLI wizard work
    tty: true
    stdin_open: true
    volumes:
      # Mount the current directory so configs, the undo journal and the excel
      # sheet persist
      - .:/app
      # ⚠️ IMPORTANT: Mount your actual media folders here!
      # We recommend mapping them to /media/Movies and /media/TV_Shows
      # These are READ-WRITE on purpose: organizing and renaming are the point
      # of this service, and a :ro mount fails every single operation.
      - /mnt/nas-media/Movies:/media/Movies
      - /mnt/nas-media/TV Shows:/media/TV_Shows
    environment:
      - TZ=${TZ:-America/New_York}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 🤖 Automated Task: Example for running a non-interactive scan
  # Command: docker compose run --rm media-scanner
  media-scanner:
    image: media-organizer:latest
    container_name: media-scanner
    volumes:
      - .:/app
      - /mnt/nas-media/Movies:/media/Movies:ro
      - /mnt/nas-media/TV Shows:/media/TV_Shows:ro
    environment:
      - TZ=${TZ:-America/New_York}
    command: ["python", "run.py", "--action", "scan", "--movies", "/media/Movies", "--tv", "/media/TV_Shows", "--output", "automated_scan.xlsx"]

# No custom network: scanning and renaming are local filesystem work. (This
# file previously pinned an `external: true` network named "pangolin", which
# made `docker compose run` fail outright unless you happened to have it.)
